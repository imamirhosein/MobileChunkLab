name: MobileChunkLab Baseline Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Launcher
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # آماده سازی SDK و پیدا کردن sdkmanager
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using existing SDK manager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a "$ANDROID_HOME/cmdline-tools/16.0/." \
              "$ANDROID_HOME/cmdline-tools/latest/"

          else
            echo "Downloading Android command line tools"

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              -o "$RUNNER_TEMP/android-tools.zip"

            mkdir -p "$RUNNER_TEMP/android-tools"

            unzip -q "$RUNNER_TEMP/android-tools.zip" \
              -d "$RUNNER_TEMP/android-tools"

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # پذیرش مجوزهای SDK
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

      # نصب ابزارهای اندروید
      - name: Install Android Dependencies
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      # دریافت Amethyst
      - name: Download Amethyst
        shell: bash
        run: |
          git clone \
            --branch v3_openjdk \
            --depth 1 \
            --recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git \
            source

      # بررسی فایل های پروژه
      - name: Check Project
        shell: bash
        run: |
          test -f source/gradlew
          echo "Amethyst source downloaded successfully"

      # ساخت APK
      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x source/gradlew
          cd source
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      # ذخیره APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileChunkLab-Baseline-APK
          path: source/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
