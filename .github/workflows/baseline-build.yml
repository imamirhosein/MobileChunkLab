name: MobileChunkLab Independent Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MobileChunkLab
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using existing SDK manager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a "$ANDROID_HOME/cmdline-tools/16.0/." \
              "$ANDROID_HOME/cmdline-tools/latest/"

          else
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              -o "$RUNNER_TEMP/android-tools.zip"

            mkdir -p "$RUNNER_TEMP/android-tools"

            unzip -q "$RUNNER_TEMP/android-tools.zip" \
              -d "$RUNNER_TEMP/android-tools"

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android Dependencies
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Configure Git HTTPS
        shell: bash
        run: |
          git config --global --add \
            url."https://github.com/".insteadOf \
            "git@github.com:"

          git config --global --add \
            url."https://github.com/".insteadOf \
            "ssh://git@github.com/"

      - name: Download Amethyst
        shell: bash
        run: |
          git clone \
            --branch v3_openjdk \
            --depth 1 \
            --recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git \
            source

      - name: Customize MobileChunkLab Identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/app_pojavlauncher/build.gradle")
          content = path.read_text(encoding="utf-8")

          replacements = {
              'org.angelauramc.amethyst':
                  'dev.mobilechunklab.launcher',

              '"Amethyst (Debug)"':
                  '"MobileChunkLab"',

              '"Amethyst"':
                  '"MobileChunkLab"',
          }

          for old, new in replacements.items():
              count = content.count(old)
              if count == 0:
                  raise SystemExit(
                      f"ERROR: Expected text not found: {old}"
                  )

              content = content.replace(old, new)
              print(f"Updated {old} -> {new} ({count} occurrence(s))")

          path.write_text(content, encoding="utf-8")

          print("MobileChunkLab identity configured successfully.")
          PY

      - name: Verify Game Classification
        shell: bash
        run: |
          MANIFEST="source/app_pojavlauncher/src/main/AndroidManifest.xml"

          grep -q 'android:appCategory="game"' "$MANIFEST"
          grep -q 'android:isGame="true"' "$MANIFEST"

          echo "Game classification settings preserved."

      - name: Check Project
        shell: bash
        run: |
          test -f source/gradlew
          test -f source/app_pojavlauncher/build.gradle

          echo "Project ready."
          grep -n 'applicationId ' \
            source/app_pojavlauncher/build.gradle

          grep -n 'app_name' \
            source/app_pojavlauncher/build.gradle

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x source/gradlew
          cd source
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileChunkLab-Independent-APK
          path: source/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
