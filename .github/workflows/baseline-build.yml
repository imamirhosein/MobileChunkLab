name: MobileChunkLab Zalith Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MobileChunkLab ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Git HTTPS
        shell: bash
        run: |
          git config --global --add \
            url."https://github.com/".insteadOf \
            "git@github.com:"

          git config --global --add \
            url."https://github.com/".insteadOf \
            "ssh://git@github.com/"

      - name: Clone ZalithLauncher2
        shell: bash
        run: |
          git clone \
            --branch main \
            --depth 1 \
            --recurse-submodules \
            https://github.com/ZalithLauncher/ZalithLauncher2.git \
            source

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Customize MobileChunkLab
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          props = Path("source/ZalithLauncher/gradle.properties")
          gradle = Path("source/ZalithLauncher/build.gradle.kts")

          p = props.read_text(encoding="utf-8")

          replacements = {
              "launcher_name=ZalithLauncher":
                  "launcher_name=MobileChunkLab",
              "launcher_app_name=Zalith Launcher":
                  "launcher_app_name=MobileChunkLab",
              "launcher_short_name=ZL2":
                  "launcher_short_name=MCL",
              "url_home=https://github.com/ZalithLauncher/ZalithLauncher2":
                  "url_home=https://github.com/imamirhosein/MobileChunkLab",
          }

          for old, new in replacements.items():
              if old not in p:
                  raise SystemExit(f"Missing property: {old}")
              p = p.replace(old, new, 1)

          props.write_text(p, encoding="utf-8")

          g = gradle.read_text(encoding="utf-8")

          old = 'val zalithPackageName = "com.movtery.zalithlauncher"'
          new = 'val zalithPackageName = "dev.mobilechunklab.zalith"'

          if old not in g:
              raise SystemExit("Original package name not found")

          g = g.replace(old, new, 1)
          gradle.write_text(g, encoding="utf-8")

          print("Identity configuration completed.")
          PY

      - name: Verify Configuration
        shell: bash
        run: |
          test -f source/gradlew
          test -f source/ZalithLauncher/build.gradle.kts
          test -f source/ZalithLauncher/gradle.properties

          grep 'launcher_name=' source/ZalithLauncher/gradle.properties
          grep 'launcher_app_name=' source/ZalithLauncher/gradle.properties
          grep 'val zalithPackageName' source/ZalithLauncher/build.gradle.kts

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          chmod +x source/gradlew
          cd source

          ./gradlew \
            ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileChunkLab-Zalith-ARM64
          path: source/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
