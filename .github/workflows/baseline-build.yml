name: MobileChunkLab Zalith Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MobileChunkLab ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout MobileChunkLab
        uses: actions/checkout@v6

      - name: Configure Git HTTPS
        shell: bash
        run: |
          git config --global --add \
            url."https://github.com/".insteadOf \
            "git@github.com:"

          git config --global --add \
            url."https://github.com/".insteadOf \
            "ssh://git@github.com/"

      - name: Clone ZalithLauncher2
        shell: bash
        run: |
          git clone \
            --branch main \
            --depth 1 \
            --recurse-submodules \
            https://github.com/ZalithLauncher/ZalithLauncher2.git \
            source

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo install cargo-ndk --locked

          cargo --version
          cargo ndk --version

          rustup target list --installed

      - name: Customize MobileChunkLab Identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          props = Path("source/ZalithLauncher/gradle.properties")
          gradle = Path("source/ZalithLauncher/build.gradle.kts")

          if not props.is_file():
              raise SystemExit("Launcher gradle.properties not found")

          if not gradle.is_file():
              raise SystemExit("Launcher build.gradle.kts not found")

          content = props.read_text(encoding="utf-8")

          replacements = {
              "launcher_name=ZalithLauncher":
                  "launcher_name=MobileChunkLab",

              "launcher_app_name=Zalith Launcher":
                  "launcher_app_name=MobileChunkLab",

              "launcher_short_name=ZL2":
                  "launcher_short_name=MCL",

              "url_home=https://github.com/ZalithLauncher/ZalithLauncher2":
                  "url_home=https://github.com/imamirhosein/MobileChunkLab",
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Expected property not found: {old}")

              content = content.replace(old, new, 1)
              print(f"Updated: {old}")

          props.write_text(content, encoding="utf-8")

          content = gradle.read_text(encoding="utf-8")

          old = 'val zalithPackageName = "com.movtery.zalithlauncher"'
          new = 'val zalithPackageName = "dev.mobilechunklab.zalith"'

          if old not in content:
              raise SystemExit("Original application package not found")

          content = content.replace(old, new, 1)

          gradle.write_text(content, encoding="utf-8")

          print("MobileChunkLab identity configured successfully.")
          PY

      - name: Verify Build Environment
        shell: bash
        run: |
          test -f source/gradlew
          test -f source/ZalithLauncher/build.gradle.kts
          test -f source/ZalithLauncher/gradle.properties
          test -f source/PetLib/build.gradle.kts

          command -v cargo
          command -v rustup

          cargo ndk --version

          grep 'launcher_name=' \
            source/ZalithLauncher/gradle.properties

          grep 'launcher_app_name=' \
            source/ZalithLauncher/gradle.properties

          grep 'val zalithPackageName' \
            source/ZalithLauncher/build.gradle.kts

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          chmod +x source/gradlew

          cd source

          ./gradlew \
            ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --no-daemon \
            --stacktrace

      - name: Upload MobileChunkLab APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MobileChunkLab-Zalith-ARM64
          path: source/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
