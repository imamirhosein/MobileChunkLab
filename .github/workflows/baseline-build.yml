name: MobileChunkLab Baseline Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Launcher
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # تنظیم مستقیم Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

          sdkmanager --version

      # پذیرش مجوزها
      - name: Accept SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true

      # نصب وابستگی‌ها
      - name: Install Android Dependencies
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      # دریافت سورس Amethyst
      - name: Download Amethyst
        shell: bash
        run: |
          git clone \
            --branch v3_openjdk \
            --depth 1 \
            --recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git \
            source

      # بررسی سورس
      - name: Check Project
        run: |
          test -f source/gradlew
          echo "Source downloaded successfully"

      # کامپایل
      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x source/gradlew
          cd source
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      # ذخیره خروجی
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileChunkLab-Baseline-APK
          path: source/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
